name: Build Minimal Static Dropbear for EN751221

on:
  workflow_dispatch:
    inputs:
      dropbear_version:
        description: 'Dropbear版本(留空=最新, 如 DROPBEAR_2026.94)'
        required: false
        default: ''

env:
  BUILD_DIR: /tmp/db-build
  INSTALL_DIR: /tmp/db-install
  TOOLCHAIN_VER: mips-linux-musl-cross
  ARTIFACT_NAME: dropbear-min-en751221

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache Toolchain
      id: cache-tc
      uses: actions/cache@v4
      with:
        path: /opt/${{ env.TOOLCHAIN_VER }}
        key: musl-${{ env.TOOLCHAIN_VER }}

    - name: Download Toolchain (musl soft-float, big-endian)
      if: steps.cache-tc.outputs.cache-hit != 'true'
      run: |
        cd /opt
        wget -q https://musl.cc/${TOOLCHAIN_VER}.tgz
        tar -xzf ${TOOLCHAIN_VER}.tgz
        rm -f ${TOOLCHAIN_VER}.tgz

    - name: Install Host Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y wget xz-utils file
        mkdir -p ${{ env.BUILD_DIR }} ${{ env.INSTALL_DIR }}

        # 验证工具链
        export PATH=/opt/${TOOLCHAIN_VER}/bin:$PATH
        ${TOOLCHAIN_VER%-cross}-gcc --version
        # 输出应为 mips-linux-musl-gcc

    - name: Get Latest Version
      id: ver
      run: |
        if [ -n "${{ github.event.inputs.dropbear_version }}" ]; then
          V="${{ github.event.inputs.dropbear_version }}"
        else
          V=$(curl -sL https://api.github.com/repos/mkj/dropbear/releases/latest \
              | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        fi
        echo "version=$V" >> $GITHUB_OUTPUT
        echo "📦 Dropbear: $V"

    - name: Download Source
      run: |
        cd ${{ env.BUILD_DIR }}
        wget -q https://github.com/mkj/dropbear/archive/refs/tags/${{ steps.ver.outputs.version }}.tar.gz
        tar -xzf ${{ steps.ver.outputs.version }}.tar.gz

    - name: Configure (Minimal, soft-float, static)
      run: |
        export PATH=/opt/${TOOLCHAIN_VER}/bin:$PATH
        cd ${{ env.BUILD_DIR }}/dropbear-${{ steps.ver.outputs.version }}

        export CC=mips-linux-musl-gcc
        export AR=mips-linux-musl-ar
        export RANLIB=mips-linux-musl-ranlib
        export STRIP=mips-linux-musl-strip

        # ⚠️ musl 工具链本身就是 soft-float, -msoft-float 与 libc ABI 一致
        export CFLAGS="-march=mips32 -msoft-float \
                       -Os -ffunction-sections -fdata-sections \
                       -fno-unwind-tables -fno-asynchronous-unwind-tables \
                       -fomit-frame-pointer \
                       -DDROPBEAR_SMALL_CODE -DDEBUG_TRACE=0"

        export LDFLAGS="-static -Wl,--gc-sections -Wl,-S -Wl,-O1"

        ./configure \
          --host=mips-linux-musl \
          --prefix=${{ env.INSTALL_DIR }} \
          --disable-zlib \
          --disable-syslog \
          --disable-lastlog \
          --disable-utmp \
          --disable-utmpx \
          --disable-wtmp \
          --disable-wtmpx \
          --disable-loginfunc \
          --disable-pututline \
          --disable-pututxline \
          --disable-shadow \
          --disable-largefile \
          --disable-harden \
          --enable-bundled-libtom \
          --enable-static

        echo "✅ 配置成功"

    - name: Build
      run: |
        export PATH=/opt/${TOOLCHAIN_VER}/bin:$PATH
        cd ${{ env.BUILD_DIR }}/dropbear-${{ steps.ver.outputs.version }}

        make -j$(nproc) PROGRAMS="dropbear dbclient dropbearkey scp"

        # install-program 目标在部分版本叫 make install, 兼容处理
        make install-program DESTDIR=${{ env.INSTALL_DIR }} 2>/dev/null \
          || make install DESTDIR=${{ env.INSTALL_DIR }}

    - name: Strip & Verify
      run: |
        export PATH=/opt/${TOOLCHAIN_VER}/bin:$PATH
        BIN_DIR=${{ env.INSTALL_DIR }}

        find $BIN_DIR -type f ! -name "*.md" ! -name "*SUMS*" \
          -exec mips-linux-musl-strip --strip-all \
          --remove-section=.comment --remove-section=.note {} \; \
          2>/dev/null || true

        echo "📉 体积:"
        find $BIN_DIR -type f -name "dropbear" -o -name "dbclient" \
          -o -name "dropbearkey" -o -name "scp" | xargs ls -lh

        echo ""
        echo "🔍 架构验证 (必须看到: MIPS + MSB + soft-float):"
        file $BIN_DIR/sbin/dropbear 2>/dev/null || file $BIN_DIR/usr/sbin/dropbear 2>/dev/null || \
          find $BIN_DIR -name dropbear -exec file {} \;

        echo ""
        echo "🔍 ELF Flags (应为 soft-float ABI):"
        find $BIN_DIR -name dropbear -exec mips-linux-musl-readelf -h {} \; \
          | grep -E "Flags|Data|Machine"
